# Phase 0 test environment; importing this Blueprint creates PAID resources.
# Gmail is intentionally unconfigured. See docs/render-phase-0-setup.md.
previews:
  generation: "off"

services:
  - type: web
    name: email-sucks-phase0-web
    runtime: elixir
    plan: 0.5c-512mb
    region: virginia
    branch: codex/phase-0-foundation
    autoDeployTrigger: "off"
    buildCommand: bin/render-build
    preDeployCommand: _build/prod/rel/email_sucks/bin/email_sucks eval 'EmailSucks.Release.migrate()'
    startCommand: _build/prod/rel/email_sucks/bin/email_sucks start
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: email-sucks-phase0-runtime
      - key: SECRET_KEY_BASE
        sync: false
      - key: APP_ROLE
        value: web
      - key: PHX_SERVER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: email-sucks-phase0-db
          property: connectionString

  - type: worker
    name: email-sucks-phase0-worker
    runtime: elixir
    plan: 0.5c-512mb
    region: virginia
    branch: codex/phase-0-foundation
    autoDeployTrigger: "off"
    buildCommand: bin/render-build
    startCommand: _build/prod/rel/email_sucks/bin/email_sucks start
    envVars:
      - fromGroup: email-sucks-phase0-runtime
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: email-sucks-phase0-web
          envVarKey: SECRET_KEY_BASE
      - key: APP_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: email-sucks-phase0-db
          property: connectionString

databases:
  - name: email-sucks-phase0-db
    plan: 0.5c-1g
    region: virginia
    postgresMajorVersion: "18"
    databaseName: email_sucks_phase0
    diskSizeGB: 5
    ipAllowList: []

envVarGroups:
  - name: email-sucks-phase0-runtime
    envVars:
      - key: ELIXIR_VERSION
        value: 1.20.4
      - key: ERLANG_VERSION
        value: 29.0.6
      - key: NODE_VERSION
        value: 26.8.1
      - key: MIX_ENV
        value: prod
      - key: POOL_SIZE
        value: "5"
      # Start inert until the web pre-deploy migration has succeeded.
      - key: RESTORE_MODE
        value: "true"

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#fff;color:#000;}
a{color:#000;text-decoration:none;}a:hover{color:#888;}
</style>
</helmet>
<div data-screen-label="Delivery" style="width:1440px;height:900px;background:#fff;color:#000;font-family:'Newsreader',Georgia,'Times New Roman',serif;font-size:19px;line-height:1.55;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;">
  <div style="width:560px;display:flex;flex-direction:column;align-items:center;gap:64px;margin-top:-24px;">
    <div style="text-align:center;display:flex;flex-direction:column;">
      <div>Mail's here.</div>
      <div>3 need you, 14 to look over.</div>
    </div>
    <div style="display:flex;gap:64px;">
      <a href="#" style="color:#000;">Start session</a>
      <a href="#" style="color:#000;">Go to desk</a>
    </div>
    <div style="position:relative;width:560px;height:40px;">
      <div style="position:absolute;left:0;right:0;top:0;height:1px;background:#000;"></div>
      <div style="position:absolute;left:70px;top:-5px;width:1px;height:11px;background:#000;"></div>
      <div style="position:absolute;left:280px;top:-5px;width:1px;height:11px;background:#000;"></div>
      <div style="position:absolute;left:490px;top:-5px;width:1px;height:11px;background:#000;"></div>
      <div style="position:absolute;left:277px;top:-3px;width:7px;height:7px;border-radius:50%;background:#000;"></div>
      <div style="position:absolute;left:70px;top:16px;transform:translateX(-50%);font-size:13px;color:#888;">9:00</div>
      <div style="position:absolute;left:280px;top:16px;transform:translateX(-50%);font-size:13px;color:#888;">1:00</div>
      <div style="position:absolute;left:490px;top:16px;transform:translateX(-50%);font-size:13px;color:#888;">5:00</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;width:560px;">
      <div>Margaret Ellison <span style="color:#888;">The Hollis contract, revised</span></div>
      <div>Tomás Reyes <span style="color:#888;">Can you speak Thursday morning?</span></div>
      <div>Priya Natarajan <span style="color:#888;">Draft two, with your notes folded in</span></div>
    </div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:36px;text-align:center;font-size:13px;color:#888;">1 doorstep · 2 pile · 3 desk · 4 page · 5 drawer</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}"></script>
</body>
</html>
